      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="40" height="40" rx="9" fill="url(#cc-squircle-bg)" />
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="8.25" stroke="url(#cc-border-grad)" stroke-width="1.2" />

  <circle cx="20" cy="20" r="13.5" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <circle cx="20" cy="20" r="13.5" stroke="url(#cc-border-grad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <line x1="20" y1="4.5" x2="20" y2="7.5" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="20" y1="32.5" x2="20" y2="35.5" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="4.5" y1="20" x2="7.5" y2="20" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" />
  <line x1="32.5" y1="20" x2="35.5" y2="20" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" />

  <polygon points="20,6.5 20,20 15,20" fill="url(#cc-north-shadow)" />
  <polygon points="20,6.5 25,20 20,20" fill="url(#cc-north-bright)" />
  <polygon points="20,33.5 15,20 20,20" fill="url(#cc-south-shadow)" />
  <polygon points="20,33.5 20,20 25,20" fill="url(#cc-south-bright)" />
  <polygon points="33.5,20 20,16.5 20,23.5" fill="#94a3b8" opacity="0.6" />
  <polygon points="6.5,20 20,23.5 20,16.5" fill="#cbd5e1" opacity="0.8" />

  <circle cx="20" cy="20" r="4.2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="20" cy="20" r="2.5" fill="url(#cc-core-glow)" />
